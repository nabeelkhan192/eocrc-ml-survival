# Two jobs, both on synthetic data only. CI never has the real SEER export
# (it is held under a Data Use Agreement and never leaves the analysis machine).
#
#   pytest             every push to main and every pull request
#   synthetic-pipeline every Monday (scheduled) and on demand: runs the whole
#                      pipeline 00-07 plus both sensitivities end-to-end on
#                      fabricated data, to catch environment drift early.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1"       # Mondays 14:17 UTC (07:17 Pacific)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # history + tags, for the frozen-tag check
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned environment
        run: pip install -r requirements-lock.txt
      - name: Run tests (all must pass)
        run: python -m pytest tests/ -q
      - name: Frozen-state checks (tag -> a2c4869, protocol unchanged, horizon 60)
        run: python project.py status

  synthetic-pipeline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned environment
        run: pip install -r requirements-lock.txt
      - name: Confirm no real data is present
        run: test ! -e data/raw/seer_crc_export.csv
      - name: Full synthetic pipeline 00-07
        run: bash run_all.sh
      - name: Both sensitivities + review file (synthetic)
        run: python project.py sensitivity-all
      - name: Keep the synthetic review file and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-run-${{ github.run_id }}
          path: logs/
          retention-days: 30
